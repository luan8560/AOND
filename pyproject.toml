[project]
name = "aioi"
version = "0.1.0"
description = "AI Ơi Nhà Đất — conversational real-estate assistant (aioinhadat.com)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pillow>=10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
